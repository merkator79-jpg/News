# sources.yaml: белый список источников новостного агрегатора
# Проверено: 2026-10-13. Следующая проверка: не позднее 2027-01-13 (раз в квартал).
#
# Статусы: allowed | allowed_with_note | signal_only | pending
# Принцип: всё, чего нет в этом файле, не используется (default: deny).
# Источники со статусом pending в рейтинге не участвуют.
#
# Критерии допуска (должны выполняться все):
#   1. Владелец установлен по открытым данным.
#   2. Нет российского или белорусского участия (государственного и частного).
#   3. Нет санкций РНБО и упоминаний в списках ЦПД/мониторингах как распространитель российской пропаганды.
#   4. Хост каждой ссылки в ленте совпадает с доменом источника.
#
# Ограничение проверки: поиск по открытым источникам по названиям изданий.
# Реестр санкций РНБО и списки ЦПД напрямую не сверялись. "Не найдено" не равно "нет".
# Правила исключения см. denylist.txt.
#
# Решение по иностранным государственным СМИ (Al Jazeera, DW): допущены только для разделов
# world и sport, не участвуют в рейтинге украинской политики.

policy:
  default: deny
  denylist_file: denylist.txt
  link_host_must_match_source_domain: true
  russia_and_belarus_equal: true   # решение владельца проекта: Беларусь приравнена к России
  telegram_as_source: false
  recheck_interval_days: 90
  odesa_tagging: "метить материалы городом по ключевым словам (Одеса, Одесса, Одещина, Одеська область) во всех допущенных источниках"

